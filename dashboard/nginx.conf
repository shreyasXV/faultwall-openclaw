worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 3000;
        server_name localhost;

        root /tmp/faultwall-openclaw-demo/dashboard;
        index index.html;

        # Serve the dashboard
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Proxy SSE + API calls to FaultWall backend to avoid CORS
        location /events {
            proxy_pass         http://localhost:8080/events;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            # SSE needs these headers
            proxy_set_header   X-Accel-Buffering no;
            add_header         Cache-Control no-cache;
            add_header         X-Content-Type-Options nosniff;
        }

        location /stats {
            proxy_pass http://localhost:8080/stats;
            proxy_set_header Host $host;
        }

        location /query {
            proxy_pass         http://localhost:8080/query;
            proxy_set_header   Host $host;
            proxy_set_header   Content-Type $http_content_type;
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
