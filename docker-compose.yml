services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faultwall_demo
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghostpass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d faultwall_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  faultwall-proxy:
    build: ./faultwall
    ports:
      - "5433:5433"
    environment:
      POLICY_FILE: /app/policies.yaml
      POLICY_ENFORCEMENT: enforce
    volumes:
      - ./demo/policies.yaml:/app/policies.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    command: ["/app/faultwall", "--proxy", "--listen", "0.0.0.0:5433", "--upstream", "postgres:5432", "--policies", "/app/policies.yaml"]
    healthcheck:
      # TCP check on the listen port. Waits until pgproto3 handshake goroutine
      # is accepting connections. Other services can depend_on: service_healthy.
      test: ["CMD-SHELL", "nc -z localhost 5433 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  faultwall-monitor:
    build: ./faultwall
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ghost:ghostpass@postgres:5432/faultwall_demo?sslmode=disable
      POLICY_FILE: /app/policies.yaml
      POLICY_ENFORCEMENT: enforce
    volumes:
      - ./demo/policies.yaml:/app/policies.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  query-executor:
    build:
      context: ./demo
      dockerfile: Dockerfile.executor
    ports:
      - "9090:9090"
    environment:
      PROXY_HOST: faultwall-proxy
      PROXY_PORT: "5433"
      PG_USER: ghost
      PG_PASS: ghostpass
      PG_DB: faultwall_demo
    depends_on:
      faultwall-proxy:
        condition: service_healthy

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - faultwall-monitor
      - query-executor

  # pgweb — Postgres web UI for the "watch the table disappear" demo beat.
  # http://localhost:8081  (auto-connected to the demo DB; read/write)
  # Intentionally points directly at Postgres (not the FaultWall proxy) so the
  # visualization always reflects true DB state, independent of policy layer.
  pgweb:
    image: sosedoff/pgweb:0.16.2
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://ghost:ghostpass@postgres:5432/faultwall_demo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081"]

  # viz — live row-count counter overlay for the "without-vs-with" split screen.
  # http://localhost:8082  (three big numbers: users, payments, feedback)
  # Polls Postgres directly every 500ms. When a table is dropped, the counter
  # flips to 0 with a red DROPPED badge. Designed for full-screen on a second
  # monitor during the demo shoot.
  viz:
    build:
      context: ./viz
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ghost
      PG_PASS: ghostpass
      PG_DB: faultwall_demo
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pg_data:
