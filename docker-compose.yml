version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: faultwall_demo
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghostpass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./demo/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d faultwall_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  faultwall-proxy:
    build: ./faultwall
    ports:
      - "5433:5433"
    environment:
      POLICY_FILE: /app/policies.yaml
      POLICY_ENFORCEMENT: enforce
    volumes:
      - ./demo/policies.yaml:/app/policies.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    command: ["/app/faultwall", "--proxy", "--listen", "0.0.0.0:5433", "--upstream", "postgres:5432", "--policies", "/app/policies.yaml"]

  faultwall-monitor:
    build: ./faultwall
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ghost:ghostpass@postgres:5432/faultwall_demo?sslmode=disable
      POLICY_FILE: /app/policies.yaml
      POLICY_ENFORCEMENT: enforce
    volumes:
      - ./demo/policies.yaml:/app/policies.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - faultwall-monitor

volumes:
  pg_data:
