# ─────────────────────────────────────────────────────────────
#  FaultWall Policy — OpenClaw Hackathon Demo
#
#  Evaluation order:
#    1. global.denied_ops       (hard stop for all agents)
#    2. global.denied_tables    (hard stop for all agents)
#    3. agent.denied_ops        (per-agent hard deny)
#    4. agent.denied_tables     (per-agent hard deny)
#    5. agent.allowed_ops       (whitelist; empty = all)
#    6. agent.allowed_tables    (whitelist; empty = all)
#    7. global.default_action   (fallback)
# ─────────────────────────────────────────────────────────────
version: "1.0"

global:
  default_action: allow          # allow | deny
  denied_ops:
    - DROP
    - TRUNCATE
    - ALTER
  denied_tables:
    - pg_shadow                  # never expose password hashes
    - pg_authid
    - information_schema.tables  # block schema snooping at global level

# ── Per-agent rules ──────────────────────────────────────────
agents:

  # ── Customer-facing read-only reporting agent ───────────────
  - id: reporting-agent
    description: "External BI agent — read only, limited tables"
    allowed_ops:
      - SELECT
    allowed_tables:
      - orders
      - products
      - customers
    denied_tables: []
    rate_limit: 100              # 100 queries/min (enforced by rate-limiter middleware, future work)

  # ── Internal ETL pipeline — broad write access ──────────────
  - id: etl-pipeline
    description: "Nightly ETL — INSERT/UPDATE on staging tables"
    allowed_ops:
      - SELECT
      - INSERT
      - UPDATE
    denied_ops:
      - DELETE                   # explicit deny overwrites allowed_ops
    allowed_tables:
      - staging_orders
      - staging_inventory
      - staging_customers
    denied_tables: []
    rate_limit: 0                # unlimited

  # ── AI customer-support agent ────────────────────────────────
  - id: support-ai
    description: "Handles customer support queries"
    allowed_ops:
      - SELECT
      - UPDATE
    denied_ops:
      - DELETE
      - DROP
      - TRUNCATE
    allowed_tables:
      - tickets
      - customers
      - products
    denied_tables:
      - payments                 # support-ai must never see payment records
      - credit_cards
    rate_limit: 200

  # ── Privileged admin agent ────────────────────────────────────
  - id: admin-agent
    description: "Full access (still blocked by global denied_ops)"
    allowed_ops: []              # empty = unrestricted (global rules still apply)
    denied_ops: []
    allowed_tables: []
    denied_tables: []
    rate_limit: 0

  # ── Rogue / test agent — almost everything denied ─────────────
  - id: untrusted-agent
    description: "Heavily sandboxed test agent"
    allowed_ops:
      - SELECT
    denied_ops:
      - INSERT
      - UPDATE
      - DELETE
      - DROP
      - TRUNCATE
      - ALTER
    allowed_tables:
      - public_products
    denied_tables: []
    rate_limit: 10
