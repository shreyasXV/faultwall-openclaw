# ── FaultWall default policy ──────────────────────────────────────────────────
# Generated by OpenClaw faultwall-shield skill.
# Location: ~/.faultwall/policies.yaml
#
# Edit this file and reload without restarting:
#   curl -X POST http://localhost:8080/api/policies/reload
#
# Docs: skill/references/policy-guide.md
# ─────────────────────────────────────────────────────────────────────────────

# If an agent is not listed below, deny all its queries by default.
# Set to "allow" only in trusted development environments.
default_policy: deny

# ── Global function blocklist ─────────────────────────────────────────────────
# These PostgreSQL functions are blocked for ALL agents regardless of other rules.
# They can read/write server files, execute OS commands, or pivot to other systems.
blocked_functions:
  # --- Filesystem access ---
  - pg_read_file             # Read arbitrary files on the DB server
  - pg_write_file            # Write arbitrary files on the DB server
  - pg_read_binary_file      # Binary file reads
  - pg_ls_dir                # List server directories

  # --- OS command execution ---
  - pg_execute_server_program  # Execute programs on the DB server host

  # --- Large object file I/O ---
  - lo_import                # Import a file from server filesystem into DB
  - lo_export                # Export a large object to server filesystem
  - lo_creat                 # Create large objects (prerequisite to lo_export)

  # --- Foreign / lateral connections ---
  - dblink                   # Open connections to other PostgreSQL servers
  - dblink_exec              # Execute SQL on a remote server
  - dblink_connect           # Establish persistent remote connection

  # --- COPY abuse (can read/write server-side files) ---
  - copy_from
  - copy_to

# ── Agents ────────────────────────────────────────────────────────────────────
agents:

  # openclaw-agent: the default agent identity for the OpenClaw faultwall-shield skill.
  # Grants broad SELECT access for read/analysis tasks while blocking all mutating
  # or destructive DDL operations and shielding sensitive tables.
  - id: openclaw-agent
    description: >
      OpenClaw default agent. Read-only access across most tables.
      Blocked from all destructive operations and sensitive system/financial tables.

    # Change this token! Set it in your connection application_name:
    #   agent:openclaw-agent:mission:<task>:token:<this-value>
    token: "changeme-openclaw"

    # ── Allowed operations ─────────────────────────────────────────────────
    # Whitelist: only these SQL operation types are permitted.
    # Everything not listed here is implicitly denied.
    allowed_operations:
      - SELECT   # Read data
      - INSERT   # Allow writes for logging / output tables if needed
      - UPDATE   # Allow non-destructive updates

    # ── Blocked operations ─────────────────────────────────────────────────
    # Belt-and-suspenders: explicitly block destructive DDL even though
    # they're not in allowed_operations above.
    blocked_operations:
      - DROP      # DROP TABLE, DROP DATABASE, DROP SCHEMA …
      - TRUNCATE  # TRUNCATE TABLE — immediate unlogged wipe
      - DELETE    # DELETE FROM — row-level deletion
      - ALTER     # ALTER TABLE, ALTER COLUMN — schema mutations
      - CREATE    # CREATE TABLE, CREATE INDEX — schema creation
      - COPY      # COPY TO/FROM FILE — server-side file I/O

    # ── Blocked tables ─────────────────────────────────────────────────────
    # These tables are off-limits regardless of operation type.
    blocked_tables:
      # PostgreSQL system catalog — leaks schema, config, and user info
      - pg_catalog
      - information_schema

      # PII / auth tables
      - users
      - user_accounts
      - accounts
      - sessions
      - tokens
      - api_keys
      - passwords
      - credentials

      # Financial / compliance tables
      - payments
      - transactions
      - invoices
      - billing
      - stripe_events

      # Audit / security tables (prevent tampering or exfiltration of audit trail)
      - audit_logs
      - audit_trail
      - security_events

    # ── Missions ───────────────────────────────────────────────────────────
    # Define scoped overrides for specific tasks. The agent must connect with
    # application_name=agent:openclaw-agent:mission:<mission-id>:token:<token>
    missions:

      # Narrow read-only reporting — no writes at all, stricter table blocklist
      - id: report
        description: "Pure read-only reporting mission"
        allowed_operations:
          - SELECT
        blocked_tables:
          - users
          - payments
          - transactions
          - sessions
          - audit_logs
          - pg_catalog
          - information_schema

      # Data analysis — can also write to a dedicated results table
      - id: data-analysis
        description: "Analysis mission — can write results to analysis_output table"
        allowed_operations:
          - SELECT
          - INSERT
        allowed_tables:
          - analysis_output
          - analysis_runs
